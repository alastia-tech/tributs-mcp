<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28">
  <!-- Ledger-lines monogram (espejo del landing): tres barras ink +
       tab granate sobre la línea central. Reads as accounting entries /
       a stack of receipts / a tax form. -->
  <rect x="0" y="6"  width="28" height="3" rx="1" fill="#0E0E10"/>
  <rect x="0" y="13" width="20" height="3" rx="1" fill="#0E0E10"/>
  <rect x="0" y="20" width="24" height="3" rx="1" fill="#0E0E10"/>
  <rect x="22" y="13" width="6"  height="3" rx="1" fill="#8C2E33"/>
</svg>
